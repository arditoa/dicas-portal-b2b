<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Pipeline · Equipe Dicas LGBT+</title>
<link rel="icon" href="/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
:root{color-scheme:light dark}
html{box-sizing:border-box}
body{margin:0}

/* Layout: faixa de orgulho no topo, resumo em linha, abas, quadro kanban com rolagem própria; ficha do lead abre como painel lateral (tela cheia no celular). */
:root{
  --bg:#F7F3F6; --surface:#FFFFFF; --surface2:#F0EAEF; --fg:#1D1223; --muted:#6C5E74; --line:#E2D8E0;
  --accent:#D3197A; --on-accent:#FFFFFF; --accent-soft:#FBE3F0;
  --bad:#C62828; --warn:#A85F00; --ok:#1B7F3B;
  --c1:#D3197A; --c2:#7A3FD1; --c3:#2563C9; --c4:#0E8A8A; --c5:#1E8A3F; --c6:#B8860B; --c7:#D2561B; --c8:#7B7080;
  --shadow:0 1px 2px rgba(40,10,40,.08),0 6px 18px rgba(40,10,40,.06);
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif-condensed,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0B10; --surface:#17141C; --surface2:#211D29; --fg:#F4EEF6; --muted:#A99DB3; --line:#2E2938;
    --accent:#FF4FA3; --on-accent:#1B0612; --accent-soft:#3A1230;
    --bad:#FF7B7B; --warn:#F2B04A; --ok:#5BD58A;
    --c1:#FF4FA3; --c2:#A98BFF; --c3:#6FA3FF; --c4:#4FD1C5; --c5:#5BD58A; --c6:#F2C94C; --c7:#FF9A5C; --c8:#9A8FA6;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0B10; --surface:#17141C; --surface2:#211D29; --fg:#F4EEF6; --muted:#A99DB3; --line:#2E2938;
  --accent:#FF4FA3; --on-accent:#1B0612; --accent-soft:#3A1230;
  --bad:#FF7B7B; --warn:#F2B04A; --ok:#5BD58A;
  --c1:#FF4FA3; --c2:#A98BFF; --c3:#6FA3FF; --c4:#4FD1C5; --c5:#5BD58A; --c6:#F2C94C; --c7:#FF9A5C; --c8:#9A8FA6;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-b);padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance}
.pride{height:5px;margin-inline:-16px;background:linear-gradient(90deg,#E40303 0 16.66%,#FF8C00 0 33.33%,#FFED00 0 50%,#008026 0 66.66%,#004CFF 0 83.33%,#732982 0)}
.app{max-width:1500px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:18px 8px}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:72px;width:auto;max-width:100%;padding:8px 14px;border-radius:12px;background:#0B0B0E;display:block}
.brand h1{font-size:34px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat{min-width:0}
.stat b{display:block;font-family:var(--font-d);font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.stat.alert b{color:var(--bad)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:6px;scrollbar-width:thin}
.tab{appearance:none;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-family:var(--font-d);font-size:18px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:20px;margin-left:6px;padding:1px 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:13px;line-height:1.3;text-align:center}
.banner{margin-top:12px;padding:10px 14px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:14px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;max-width:380px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;line-height:1.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:999px;font-weight:600;line-height:1.2;white-space:nowrap;width:auto}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px;scroll-snap-type:x proximity}
.col{flex:0 0 min(292px,84vw);scroll-snap-align:start;background:var(--surface2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 2px 4px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--c8)}
.col-head h3{font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;overflow-wrap:anywhere}
.col-head .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.col-sum{font-size:12px;color:var(--muted);padding:0 2px 2px;font-variant-numeric:tabular-nums}
.col-add{align-self:flex-start}
.col-empty{border:1px dashed var(--line);border-radius:8px;padding:14px 10px;color:var(--muted);font-size:13px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);min-width:0}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.45}
.card-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card-top strong{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.av{width:22px;height:22px;border-radius:50%;flex:none;background:var(--surface2)}
.sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px 10px}
.lnk{font-size:13px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.col-name{appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;text-align:left}
.col-name:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);line-height:1.5}
.chip.atraso{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.hoje{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.t-quente{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.t-medio{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.t-frio{background:color-mix(in srgb,var(--c3) 16%,transparent);color:var(--c3)}
.toolbar select{width:auto;max-width:100%;border-radius:999px;padding:8px 14px;font-weight:600}
.chip.canal{background:var(--accent-soft);color:var(--accent)}
.view-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.view-h h2{font-size:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.view-h p{margin:0;color:var(--muted)}
.list{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .who{flex:1 1 220px;min-width:0}
.row .who strong{overflow-wrap:anywhere}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
.group-h{font-family:var(--font-d);font-size:18px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:16px 0 8px;display:flex;gap:8px;align-items:center}
.group-h.atraso{color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty h3{font-size:22px;color:var(--fg);margin-bottom:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.pill{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.step-head{display:grid;grid-template-columns:76px 130px minmax(0,1fr) auto;gap:8px;align-items:end}
.step-btns{display:flex;gap:4px}
.icon-btn{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:34px;font-size:16px;line-height:1}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn:disabled{opacity:.35;cursor:default}
.fases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fase-row{display:grid;grid-template-columns:auto auto minmax(140px,1fr) 150px 190px auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sw{display:flex;gap:4px;flex-wrap:wrap;max-width:118px}
.sw button{appearance:none;cursor:pointer;width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
.count{font-size:13px;color:var(--muted);white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint code{background:var(--surface2);padding:1px 5px;border-radius:4px}
.overlay{position:fixed;inset:0;background:rgba(10,5,15,.55);display:flex;justify-content:flex-end;z-index:20}
.sheet{background:var(--bg);width:min(600px,100%);height:100%;overflow-y:auto;padding:18px 18px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.sheet.modal{width:min(460px,100%);height:auto;max-height:100%;margin:auto;border-radius:12px}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.sheet-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sheet-h h2{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere;line-height:1.05}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.next{border:1px solid var(--accent);background:var(--surface);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.next h3{font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#dv-resp{display:flex;flex-direction:column;gap:10px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;font-size:14px}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
.loading{padding:48px 0;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .fase-row{grid-template-columns:auto minmax(0,1fr) auto;}
  .fase-row .sw{grid-column:1 / -1;max-width:none}
  .fase-row .f-nome{grid-column:1 / -1}
  .fase-row select{grid-column:1 / -1}
}
@media (max-width:640px){
  .brand h1{font-size:28px}
  .step-head{grid-template-columns:70px minmax(0,1fr)}
  .step-head .f-tit{grid-column:1 / -1}
  .step-btns{grid-column:1 / -1}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .sheet{padding-inline:14px}
  .hist li{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}


[hidden]{display:none!important}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.who-nome{font-weight:600}
body.deslogado .app,body.deslogado #overlay{display:none}
.login{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
.login-box{width:min(420px,100%)}
.login-box h2{font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.login-box form{display:flex;flex-direction:column;gap:12px}
.login-box p{margin:0}
.erro-login{color:var(--bad);font-weight:600;font-size:14px}
.cl-stats{margin-bottom:14px}
.cl-msg{margin-bottom:14px}
.cl-filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.cl-filtros input[type=search]{flex:1 1 220px;min-width:0;max-width:380px}
.cl-filtros select,.row select{width:auto;max-width:100%}
.cl-pag{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 24px}
.btn:disabled{opacity:.4;cursor:default}

</style>

/* ---------- datas ---------- */
function pad(n){return String(n).padStart(2,'0')}
function toStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function hoje(){return toStr(new Date())}
function addDias(s,n){var d=parse(s);d.setDate(d.getDate()+n);return toStr(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function fmtData(s){var d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function maxData(a,b){return a>b?a:b}
function fmtHora(ms){var d=new Date(ms);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}

/* ---------- acesso a dados ---------- */
function fasesOrd(){return S.fases.slice().sort(function(a,b){return (a.ordem||0)-(b.ordem||0)})}
function faseDe(l){return S.fases.find(function(f){return f.id===l.faseId})}
function cadDe(l){return l.cadenciaId?S.cadencias.find(function(c){return c.id===l.cadenciaId}):null}
function tipoDe(l){var f=faseDe(l);return f?(f.tipo||'andamento'):'andamento'}
function passosDe(c){return (c&&c.passos)||[]}

function proximoInfo(l){
  if(tipoDe(l)!=='andamento')return {k:'fim'};
  var c=cadDe(l);if(!c)return {k:'sem'};
  var ps=passosDe(c),i=l.passo||0;
  if(i>=ps.length)return {k:'concluida'};
  var p=ps[i];
  if(!l.proxima)return {k:'semdata',p:p,i:i,c:c};
  var dd=diff(l.proxima,hoje());
  return {k:dd<0?'atraso':dd===0?'hoje':'futuro',dd:dd,p:p,i:i,c:c};
}
function proximaCalc(l){
  var c=cadDe(l);if(!c||!l.inicio)return '';
  var ps=passosDe(c),i=l.passo||0;if(i>=ps.length)return '';
  return maxData(hoje(),addDias(l.inicio,(ps[i].dia||1)-1));
}
function dadosCadencia(c){
  var ini=hoje(),p=passosDe(c)[0];
  return {cadenciaId:c.id,inicio:ini,passo:0,proxima:p?addDias(ini,(p.dia||1)-1):''};
}
function pushHist(l,tipo,texto){
  var h=(l.historico||[]).slice(-59);
  h.push({em:Date.now(),tipo:tipo,texto:texto,por:S.me.id||''});
  return h;
}
function msgPreenchida(l,p){
  var meu=(S.me.name||'').split(' ')[0]||'a equipe';
  return (p.mensagem||'').replace(/\{(\w+)\}/g,function(m,k){
    if(k==='empresa')return l.empresa||'';
    if(k==='contato')return (l.contato||'').split(' ')[0]||'pessoal';
    if(k==='bairro')return l.bairro||'sua região';
    if(k==='meu_nome')return meu;
    return m;
  });
}

/* ---------- escrita (uma por documento, em fila) ---------- */
var filas={};
function erroMsg(e){
  var c=e&&e.code;
  if(c==='quota_exceeded')return 'O limite do banco foi atingido. Apague registros antigos.';
  if(c==='sem_permissao')return 'Sem permissão para salvar. Entre de novo ou peça à Andrea para liberar o seu acesso.';
  return 'Não foi possível salvar agora. Tente de novo.';
}
function escrever(path,fn){
  var prev=filas[path]||Promise.resolve();
  var p=prev.catch(function(){}).then(fn);
  filas[path]=p;
  p.catch(function(e){toast(erroMsg(e))});
  return p;
}
function upd(col,id,data){return escrever(col+'/'+id,function(){return S.db.doc(col+'/'+id).update(data)})}
function lerLead(id){return S.leads.find(function(x){return x.id===id})}
function updLead(id,data){data.atualizadoEm=Date.now();return upd('leads',id,data)}

/* ---------- ações de negócio ---------- */
async function criarLead(d){
  var fases=fasesOrd();
  if(!fases.length){toast('As fases ainda não carregaram. Recarregue a página ou crie uma fase.');throw new Error('sem fases')}
  var faseId=d.faseId||(fases[0]&&fases[0].id)||'';
  var f=S.fases.find(function(x){return x.id===faseId});
  var now=Date.now();
  var lead={empresa:d.empresa.trim(),contato:(d.contato||'').trim(),telefone:(d.telefone||'').trim(),email:'',instagram:'',
    bairro:(d.bairro||'').trim(),categoria:'',polo:'',origem:'',temperatura:'',oferta:'Cota Fundador',valor:3490,notas:'',
    faseId:faseId,cadenciaId:'',passo:0,inicio:'',proxima:'',responsavel:S.me.id||'',criadoEm:now,atualizadoEm:now,
    historico:[{em:now,tipo:'sistema',texto:'Lead criado'+(f?' em '+f.nome:''),por:S.me.id||''}]};
  if(f&&(f.tipo||'andamento')==='andamento'&&f.cadenciaId){
    var c=S.cadencias.find(function(x){return x.id===f.cadenciaId});
    if(c){Object.assign(lead,dadosCadencia(c));lead.historico.push({em:now,tipo:'sistema',texto:'Cadência iniciada: '+c.nome,por:S.me.id||''})}
  }
  var ref=S.db.collection('leads').doc();
  await escrever(ref.path,function(){return ref.set(lead)});
  return ref.id;
}
function moverLead(id,faseId){
  var l=lerLead(id),f=S.fases.find(function(x){return x.id===faseId});
  if(!l||!f||l.faseId===faseId)return;
  var d={faseId:faseId},h=pushHist(l,'fase','Movido para '+f.nome);
  var tipo=f.tipo||'andamento';
  if(tipo!=='andamento'){d.proxima=''}
  else{
    var c=f.cadenciaId&&S.cadencias.find(function(x){return x.id===f.cadenciaId});
    if(c&&l.cadenciaId!==c.id){Object.assign(d,dadosCadencia(c));h.push({em:Date.now(),tipo:'sistema',texto:'Cadência iniciada: '+c.nome,por:S.me.id||''})}
    else if(!l.proxima){var p=proximaCalc(l);if(p)d.proxima=p}
  }
  d.historico=h;
  return updLead(id,d);
}
function concluirPasso(id){
  var l=lerLead(id);if(!l)return;
  var info=proximoInfo(l);if(!info.p)return;
  var ps=passosDe(info.c),next=info.i+1;
  var h=pushHist(l,'passo','Passo feito: D'+info.p.dia+' · '+(CANAIS[info.p.canal]||'Outro')+(info.p.titulo?' · '+info.p.titulo:''));
  var d={passo:next,proxima:''};
  if(next<ps.length){d.proxima=maxData(hoje(),addDias(l.inicio||hoje(),(ps[next].dia||1)-1))}
  else{h.push({em:Date.now(),tipo:'sistema',texto:'Cadência concluída',por:S.me.id||''})}
  d.historico=h;
  return updLead(id,d).then(function(){toast(next<ps.length?'Passo concluído. Próximo: '+fmtData(d.proxima):'Cadência concluída')});
}
function adiar(id,n){
  var l=lerLead(id);if(!l)return;
  var base=maxData(l.proxima||hoje(),hoje());
  return updLead(id,{proxima:addDias(base,n),historico:pushHist(l,'sistema','Passo adiado em '+n+(n===1?' dia':' dias'))});
}
function iniciarCadencia(id,cadId){
  var l=lerLead(id),c=S.cadencias.find(function(x){return x.id===cadId});
  if(!l||!c)return;
  var d=dadosCadencia(c);
  d.historico=pushHist(l,'sistema','Cadência iniciada: '+c.nome);
  return updLead(id,d);
}
function limparCadencia(id){
  var l=lerLead(id);if(!l)return;
  return updLead(id,{cadenciaId:'',inicio:'',passo:0,proxima:'',historico:pushHist(l,'sistema','Cadência removida')});
}

/* ---------- utilidades de interface ---------- */
var toastT=0;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}
async function copiar(texto,ta){
  try{await navigator.clipboard.writeText(texto);toast('Mensagem copiada')}
  catch(e){if(ta){ta.focus();ta.select()}toast('Selecione o texto e copie com Ctrl+C')}
}
function armar(btn,acao){
  if(btn.dataset.armed){clearTimeout(+btn.dataset.armed);delete btn.dataset.armed;btn.classList.remove('armed');btn.textContent=btn.dataset.orig;acao();return}
  btn.dataset.orig=btn.textContent;btn.classList.add('armed');btn.textContent='Clique de novo para confirmar';
  btn.dataset.armed=setTimeout(function(){delete btn.dataset.armed;btn.classList.remove('armed');btn.textContent=btn.dataset.orig},4000);
}
function waUrl(l,msg){
  var d=(l.telefone||'').replace(/\D/g,'');if(!d)return '';
  if(d.length<=11&&d.indexOf('55')!==0)d='55'+d;
  return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg);
}
function igUrl(l){
  var h=(l.instagram||'').trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@/,'').split(/[\/?]/)[0];
  return h?'https://www.instagram.com/'+encodeURIComponent(h)+'/':'';
}
function selectHtml(field,opts,val){
  var o=opts.slice();if(val&&o.indexOf(val)<0)o.push(val);
  return '<select data-f="'+field+'"><option value="">—</option>'+o.map(function(x){return '<option'+(x===val?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>';
}

/* ---------- nomes e avatares ---------- */
async function resolverPessoas(root){
  if(!S.user)return;
  var els=$$('[data-uid]',root||document);if(!els.length)return;
  var ids=[];els.forEach(function(e){var u=e.dataset.uid;if(u&&ids.indexOf(u)<0)ids.push(u)});
  if(!ids.length)return;
  try{
    var ps=await S.user.profiles(ids);
    els.forEach(function(e){
      var p=ps[e.dataset.uid];if(!p)return;
      if(e.tagName==='IMG'){e.src=p.avatarUrl;e.alt=p.name||'';e.title=p.name||''}
      else{e.textContent=p.isMe?'Você':(p.name||'Alguém')}
    });
  }catch(e){}
}

/* ---------- resumo e abas ---------- */
function visiveis(){
  var q=S.busca.trim().toLowerCase();
  return S.leads.filter(function(l){
    if(S.meus&&l.responsavel!==S.me.id)return false;
    if(S.temp==='-'){if(l.temperatura)return false}else if(S.temp&&l.temperatura!==S.temp)return false;
    if(!q)return true;
    return [l.empresa,l.contato,l.bairro,l.instagram,l.telefone,l.email,l.notas].join(' ').toLowerCase().indexOf(q)>=0;
  });
}
function renderStats(){
  var ab=0,valor=0,ho=0,at=0,gan=0,gv=0;
  S.leads.forEach(function(l){
    var t=tipoDe(l);
    if(t==='andamento'){ab++;valor+=+l.valor||0;var k=proximoInfo(l).k;if(k==='hoje')ho++;if(k==='atraso')at++}
    else if(t==='ganho'){gan++;gv+=+l.valor||0}
  });
  var pronto=S.ready.l&&S.ready.f;
  var v=function(n){return pronto?n:'—'};
  $('#stats').innerHTML=
    '<div class="stat"><b>'+v(ab)+'</b><small>Em andamento</small></div>'+
    '<div class="stat"><b>'+v(BRL.format(valor))+'</b><small>Valor em jogo</small></div>'+
    '<div class="stat'+(at?' alert':'')+'"><b>'+v(ho+at)+'</b><small>Para hoje'+(at?' ('+at+' atrasadas)':'')+'</small></div>'+
    '<div class="stat"><b>'+v(gan)+'</b><small>Fechados · '+(pronto?BRL.format(gv):'—')+'</small></div>';
  return ho+at;
}
function renderTabs(n){
  $('#tabs').innerHTML=TABS.map(function(t){
    return '<button class="tab" data-act="tab" data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[0]==='hoje'&&n?'<span class="n">'+n+'</span>':'')+'</button>';
  }).join('');
}

/* ---------- quadro ---------- */
function chipProximo(l){
  var i=proximoInfo(l);
  if(i.k==='fim'){var f=faseDe(l);return '<span class="chip '+(f&&f.tipo==='ganho'?'ok':'')+'">'+(f&&f.tipo==='ganho'?'Fechado · '+BRL.format(+l.valor||0):'Encerrado')+'</span>'}
  if(i.k==='sem')return '<span class="chip">Sem cadência</span>';
  if(i.k==='concluida')return '<span class="chip">Cadência concluída</span>';
  if(i.k==='semdata')return '<span class="chip">Defina a data</span>';
  var txt=i.k==='atraso'?'Atrasado '+(-i.dd)+'d':i.k==='hoje'?'Hoje':i.dd===1?'Amanhã':fmtData(l.proxima);
  return '<span class="chip '+(i.k==='atraso'||i.k==='hoje'?i.k:'')+'">'+txt+'</span>'+
         '<span class="chip canal">D'+i.p.dia+' · '+esc(CANAIS[i.p.canal]||'Outro')+'</span>';
}
function linksContato(l){
  var a=[],w=waUrl(l,''),ig=igUrl(l);
  if(w)a.push('<a class="lnk" href="'+esc(w)+'" target="_blank" rel="noopener">WhatsApp '+esc(l.telefone)+'</a>');
  if(ig)a.push('<a class="lnk" href="'+esc(ig)+'" target="_blank" rel="noopener">Instagram</a>');
  return a.length?'<div class="chips">'+a.join('')+'</div>':'';
}
function cardHtml(l){
  var sub=[l.bairro,l.categoria].filter(Boolean).join(' · ');
  return '<article class="card" draggable="true" data-open="'+esc(l.id)+'" data-id="'+esc(l.id)+'">'+
    '<div class="card-top"><strong>'+esc(l.empresa)+'</strong>'+(l.responsavel?'<img class="av" data-uid="'+esc(l.responsavel)+'" alt="">':'')+'</div>'+
    (sub?'<div class="sub">'+esc(sub)+'</div>':'')+
    (l.contato?'<div class="sub">'+esc(l.contato)+'</div>':'')+
    linksContato(l)+
    '<div class="chips">'+tempChip(l)+chipProximo(l)+'</div></article>';
}
function viewQuadro(){
  var fases=fasesOrd();
  if(!fases.length&&!S.leads.length)return '<div class="empty"><h3>Nenhuma fase carregada</h3><p>Se você acabou de abrir a página, aguarde alguns segundos ou recarregue. Para criar as fases do funil, use a aba Fases.</p><button class="btn primary" data-act="tab" data-tab="fases">Ir para Fases</button></div>';
  var lv=visiveis(),ids={};fases.forEach(function(f){ids[f.id]=1});
  var cols=fases.map(function(f){return {f:f,leads:lv.filter(function(l){return l.faseId===f.id})}});
  var orf=lv.filter(function(l){return !ids[l.faseId]});
  if(orf.length)cols.unshift({f:{id:'',nome:'Sem fase',cor:'c8',tipo:'andamento'},leads:orf});
  return '<div class="board">'+cols.map(function(c){
    var f=c.f,soma=c.leads.reduce(function(s,l){return s+(+l.valor||0)},0);
    c.leads.sort(function(a,b){var x=a.proxima||'9999',y=b.proxima||'9999';return x<y?-1:x>y?1:(a.empresa||'').localeCompare(b.empresa||'')});
    return '<section class="col" data-fase="'+esc(f.id)+'">'+
      '<div class="col-head"><span class="dot" style="background:var(--'+esc(f.cor||'c8')+')"></span><h3>'+(f.id?'<button class="col-name" data-act="tab" data-tab="fases" title="Editar fases e cadências">'+esc(f.nome)+'</button>':esc(f.nome))+'</h3><span class="cnt">'+c.leads.length+'</span></div>'+
      '<div class="col-sum">'+(f.tipo==='ganho'?'Ganho · ':f.tipo==='perdido'?'Perdido · ':'')+BRL.format(soma)+(f.cadenciaId?' · inicia cadência':'')+'</div>'+
      (c.leads.length?c.leads.map(cardHtml).join(''):'<div class="col-empty">Arraste um lead para cá</div>')+
      (f.id?'<button class="btn small col-add" data-act="novo" data-fase="'+esc(f.id)+'">+ Lead</button>':'')+
    '</section>';
  }).join('')+'</div>';
}

/* ---------- hoje ---------- */
function rowHoje(l){
  var i=proximoInfo(l);
  return '<li class="row" data-open="'+esc(l.id)+'"><div class="who"><strong>'+esc(l.empresa)+'</strong><div class="sub">'+esc([l.bairro,l.contato].filter(Boolean).join(' · '))+'</div></div>'+
    '<div class="chips"><span class="chip canal">D'+i.p.dia+' · '+esc(CANAIS[i.p.canal]||'Outro')+'</span>'+(i.p.titulo?'<span class="chip">'+esc(i.p.titulo)+'</span>':'')+'<span class="chip '+(i.k==='atraso'||i.k==='hoje'?i.k:'')+'">'+(i.k==='atraso'?'Atrasado '+(-i.dd)+'d':i.k==='hoje'?'Hoje':fmtData(l.proxima))+'</span></div>'+
    '<div class="acts"><button class="btn small" data-act="copiar-msg" data-id="'+esc(l.id)+'">Copiar mensagem</button><button class="btn small primary" data-act="concluir" data-id="'+esc(l.id)+'">Concluir passo</button></div></li>';
}
function viewHoje(){
  var lv=visiveis().filter(function(l){var k=proximoInfo(l).k;return k==='atraso'||k==='hoje'||k==='futuro'});
  var at=lv.filter(function(l){return proximoInfo(l).k==='atraso'}).sort(function(a,b){return a.proxima<b.proxima?-1:1});
  var ho=lv.filter(function(l){return proximoInfo(l).k==='hoje'});
  var lim=addDias(hoje(),7);
  var pr=lv.filter(function(l){var k=proximoInfo(l);return k.k==='futuro'&&l.proxima<=lim}).sort(function(a,b){return a.proxima<b.proxima?-1:1});
  var sem=visiveis().filter(function(l){var k=proximoInfo(l).k;return k==='sem'||k==='semdata'}).length;
  var h='<div class="view-h"><h2>Rotina de hoje</h2><p>'+(ho.length+at.length)+' passos para fazer agora'+(sem?' · '+sem+' leads sem cadência':'')+'</p></div>';
  if(!ho.length&&!at.length&&!pr.length)return h+'<div class="empty"><h3>Nada para fazer agora</h3><p>Quando um lead entrar numa cadência, o próximo passo aparece aqui no dia certo.</p></div>';
  function grupo(t,cls,arr){return arr.length?'<div class="group-h '+cls+'">'+t+' <span class="chip">'+arr.length+'</span></div><ul class="list">'+arr.map(rowHoje).join('')+'</ul>':''}
  return h+grupo('Atrasados','atraso',at)+grupo('Hoje','',ho)+grupo('Próximos 7 dias','',pr);
}

function viewCadencias(){
  var cads=S.cadencias.slice().sort(function(a,b){return (a.nome||'').localeCompare(b.nome||'')});
  if(!S.cadSel||!cads.some(function(c){return c.id===S.cadSel}))S.cadSel=cads[0]&&cads[0].id;
  var c=cads.find(function(x){return x.id===S.cadSel});
  var h='<div class="view-h"><h2>Cadências</h2><p>Sequências de toques que o time segue em cada lead.</p></div>'+

  if(!c)return h+'<div class="empty"><h3>Nenhuma cadência</h3><p>Crie a primeira para definir os passos de contato.</p></div>';

function lerPassos(){

function salvarPassos(ps,ordenar){

function refreshFicha(){
  if(!S.open)return;
  var l=lerLead(S.open);

  if(nx&&!(nx.contains(document.activeElement)&&/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)))nx.innerHTML=proximoHtml(l);

function fechar(){S.open=null;S.modal=null;var ov=$('#overlay');ov.hidden=true;ov.innerHTML=''}

/* ---------- render geral ---------- */
function render(){
  var y=window.scrollY,n=renderStats(),foco=clFoco();
  renderTabs(n);
  $('#toolbar').hidden=!(S.tab==='quadro'||S.tab==='hoje');
  var v=$('#view');
  if(S.erro){v.innerHTML='<div class="empty"><h3>Não foi possível abrir o pipeline</h3><p>'+esc(S.erro)+'</p></div>';return}
  if(!(S.ready.f&&S.ready.c&&S.ready.l)){v.innerHTML='<div class="loading">Carregando o pipeline…</div>';return}
  v.innerHTML=S.tab==='quadro'?viewQuadro():S.tab==='hoje'?viewHoje():S.tab==='cadencias'?viewCadencias():S.tab==='clientes'?viewClientes():viewFases();
  window.scrollTo(0,y);
  resolverPessoas(v);clFocar(foco);
}
function emCampo(){var a=document.activeElement;return !!(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}
function schedule(){
  if(S.raf)return;
  S.raf=requestAnimationFrame(function(){
    S.raf=0;
    if(((S.tab==='cadencias'||S.tab==='fases')&&emCampo())||(S.tab==='clientes'&&clEditando())){S.dirty=true;var n=renderStats();renderTabs(n)}
    else render();
    refreshFicha();
  });
}
document.addEventListener('focusout',function(){
  setTimeout(function(){if(S.dirty&&!emCampo()){S.dirty=false;render()}},300);
});

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  if(e.target.closest('a[href]'))return;
  var a=e.target.closest('[data-act]');
  if(a){acao(a,e);return}
  var o=e.target.closest('[data-open]');
  if(o){abrirLead(o.dataset.open);return}
  if(e.target.id==='overlay')fechar();
});
function idDoBotao(a){return a.dataset.id||S.open}
function acao(a,e){
  var act=a.dataset.act,id;
  if(act==='tab'){S.tab=a.dataset.tab;try{localStorage.setItem('pipeline-tab',S.tab)}catch(x){}render();return}
  if(act==='meus'){S.meus=!S.meus;a.setAttribute('aria-pressed',String(S.meus));render();return}
  if(act==='novo'){abrirNovo(a.dataset.fase);return}
  if(act==='fechar'){fechar();return}
  if(act==='copiar-email'){var le=lerLead(S.open);if(le&&le.email){copiar(le.email);}return}
  if(act==='copiar-box'){var ta=$('#msg');if(ta)copiar(ta.value,ta);return}
  if(act==='copiar-msg'){var l=lerLead(a.dataset.id),i=l&&proximoInfo(l);if(i&&i.p)copiar(msgPreenchida(l,i.p));return}
  if(act==='concluir'){concluirPasso(idDoBotao(a));return}
  if(act==='adiar'){adiar(S.open,+a.dataset.n);return}
  if(act==='limpar-cad'){limparCadencia(S.open);return}
  if(act==='assumir'){if(S.me.id)updLead(S.open,{responsavel:S.me.id,historico:pushHist(lerLead(S.open),'sistema','Lead assumido')});return}
  if(act==='nota'){
    var inp=$('#nota-h'),txt=inp&&inp.value.trim();if(!txt)return;
    var ld=lerLead(S.open);if(!ld)return;
    inp.value='';updLead(S.open,{historico:pushHist(ld,'nota',txt)});return;
  }
  if(act==='apagar-lead'){
    armar(a,function(){var lid=S.open;fechar();escrever('leads/'+lid,function(){return S.db.doc('leads/'+lid).delete()}).then(function(){toast('Lead apagado')})});return;
  }
  /* cadências */
  if(act==='cad-sel'){S.cadSel=a.dataset.id;render();return}
  if(act==='cad-nova'){
    var r=S.db.collection('cadencias').doc();S.cadSel=r.id;
    escrever(r.path,function(){return r.set({nome:'Nova cadência',passos:[{dia:1,canal:'whatsapp',titulo:'Primeiro contato',mensagem:'Oi {contato}, tudo bem? Aqui é {meu_nome}, do Dicas LGBT+.'}]})});return;
  }
  if(act==='cad-dup'){
    var c=S.cadencias.find(function(x){return x.id===S.cadSel});if(!c)return;
    var r2=S.db.collection('cadencias').doc();S.cadSel=r2.id;
    escrever(r2.path,function(){return r2.set({nome:(c.nome||'Cadência')+' (cópia)',passos:JSON.parse(JSON.stringify(passosDe(c)))})});return;
  }
  if(act==='cad-del'){
    armar(a,function(){
      var cid=S.cadSel,uso=S.leads.filter(function(l){return l.cadenciaId===cid}).length;
      if(uso){toast('Há '+uso+' leads nesta cadência. Pare a cadência neles antes de apagar.');return}
      S.cadSel=null;escrever('cadencias/'+cid,function(){return S.db.doc('cadencias/'+cid).delete()});
    });return;
  }
  if(act==='step-add'){var ps=lerPassos(),ult=ps[ps.length-1];ps.push({dia:ult?ult.dia+2:1,canal:'whatsapp',titulo:'',mensagem:''});salvarPassos(ps,false);return}
  var li=a.closest('.step');
  if(li){
    var ix=+li.dataset.i,pp=lerPassos();
    if(act==='step-del'){pp.splice(ix,1);salvarPassos(pp,false);return}
    if(act==='step-up'&&ix>0){var t1=pp[ix];pp[ix]=pp[ix-1];pp[ix-1]=t1;salvarPassos(pp,false);return}
    if(act==='step-down'&&ix<pp.length-1){var t2=pp[ix];pp[ix]=pp[ix+1];pp[ix+1]=t2;salvarPassos(pp,false);return}
  }
  /* fases */
  if(act==='fase-add'){
    var fs=fasesOrd(),ord=fs.length?(fs[fs.length-1].ordem||0)+1:1,rf=S.db.collection('fases').doc();
    escrever(rf.path,function(){return rf.set({nome:'Nova fase',ordem:ord,cor:'c3',tipo:'andamento',cadenciaId:''})});return;
  }
  var row=a.closest('.fase-row');
  if(row){
    var fid=row.dataset.id,lista=fasesOrd(),k=lista.findIndex(function(f){return f.id===fid});
    if(act==='fase-cor'){upd('fases',fid,{cor:a.dataset.cor});return}
    if((act==='fase-up'&&k>0)||(act==='fase-down'&&k<lista.length-1)){
      var o=lista[act==='fase-up'?k-1:k+1],me=lista[k],oa=o.ordem||0,ma=me.ordem||0;
      if(oa===ma){ma=k;oa=act==='fase-up'?k-1:k+1}
      upd('fases',me.id,{ordem:oa}).then(function(){return upd('fases',o.id,{ordem:ma})});return;
    }
    if(act==='fase-del'){armar(a,function(){escrever('fases/'+fid,function(){return S.db.doc('fases/'+fid).delete()})});return}
  }
}
document.addEventListener('change',function(e){
  var t=e.target,d=t.dataset;
  if(d.f){
    var l=lerLead(S.open);if(!l)return;
    var v=t.value;
    if(d.f==='empresa'){v=v.trim();if(!v){t.value=l.empresa;return}}
    if(d.f==='valor')v=Math.max(0,Number(v)||0);
    var up={};up[d.f]=v;
    if(d.f==='oferta'&&v==='Cota Fundador'&&!(+l.valor))up.valor=3490;
    updLead(S.open,up);
    if(d.f==='empresa'){var h=$('.sheet-h h2');if(h)h.textContent=v}
    return;
  }
  if(d.chg==='temp'){S.temp=t.value;render();return}
  if(d.chg==='move'){moverLead(S.open,t.value);return}
  if(d.chg==='set-cad'){if(t.value)iniciarCadencia(S.open,t.value);return}

function clIdade(s){
  if(!s)return null;
  var p=s.split('-').map(Number),h=new Date(),i=h.getFullYear()-p[0];
  if(h.getMonth()+1<p[1]||(h.getMonth()+1===p[1]&&h.getDate()<p[2]))i--;

}

function clPares(dias){
  var out=[],d=new Date();
  for(var i=0;i<dias;i++){
    var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i);
    out.push('and(nasc_mes.eq.'+(x.getMonth()+1)+',nasc_dia.eq.'+x.getDate()+')');
  }
  return out.join(',');
}
function clFiltros(q){
  var c=S.cl;
  if(c.status)q=q.eq('status',c.status);
  if(c.sexo)q=q.eq('sexo',c.sexo);
  var t=c.q.trim();
  if(t){
    var dg=t.replace(/\D/g,'');
    if(/[A-Za-zÀ-ÿ]/.test(t)||dg.length<4)q=q.ilike('nome','%'+t.replace(/[%_,()\\]/g,' ').trim()+'%');
    else q=q.ilike('telefone','%'+dg+'%');
  }
  if(c.aniv==='hoje')q=q.or(clPares(1));
  else if(c.aniv==='semana')q=q.or(clPares(7));
  else if(c.aniv==='mes')q=q.eq('nasc_mes',new Date().getMonth()+1);
  return q;
}

async function clCarregar(){
  var c=S.cl;
  if(!sb||c.carregando)return;
  c.carregando=true;c.erro='';
  try{
    var a=c.pagina*c.tam;
    var q=clFiltros(sb.from('pipeline_clientes').select('id,nome,telefone,nascimento,sexo,status,enviado_em',{count:'exact'}));
    q=c.aniv?q.order('nasc_mes').order('nasc_dia').order('nome'):q.order('nome');
    var r=await q.range(a,a+c.tam-1);
    if(r.error)throw r.error;
    c.rows=r.data||[];c.total=r.count||0;
  }catch(e){
    c.erro=(e&&(e.code==='42P01'||e.code==='PGRST205'))?'A tabela de clientes ainda não existe. Rode a migration 043 no Supabase.':'Não consegui carregar os clientes. Tente de novo.';
    c.rows=[];c.total=0;
  }
  c.carregando=false;c.carregado=true;
  schedule();
  clStats();
}
async function clStats(){
  if(!sb)return;
  var d=new Date(),h0=new Date();h0.setHours(0,0,0,0);
  function cnt(f){
    var q=sb.from('pipeline_clientes').select('id',{count:'exact',head:true});
    return f(q).then(function(r){return r.count||0},function(){return 0});
  }
  var r=await Promise.all([
    cnt(function(q){return q}),
    cnt(function(q){return q.eq('status','novo')}),
    cnt(function(q){return q.neq('status','novo')}),
    cnt(function(q){return q.eq('nasc_mes',d.getMonth()+1).eq('nasc_dia',d.getDate())}),
    cnt(function(q){return q.gte('enviado_em',h0.toISOString())})
  ]);
  S.cl.stats={total:r[0],novo:r[1],contatados:r[2],hoje:r[3],enviadosHoje:r[4]};
  schedule();
}
async function clMarcar(id,status){
  var c=S.cl,r=c.rows.find(function(x){return String(x.id)===String(id)});

}

function novoId(){
  var a=new Uint8Array(10);crypto.getRandomValues(a);
  return Array.prototype.map.call(a,function(b){return (b%36).toString(36)}).join('');
}
function dbErro(e){

  err.code=(e&&(e.code==='42501'||e.code==='PGRST301'||e.status===401||e.status===403))?'sem_permissao':'erro';

/* Camada de dados com a mesma forma do banco antigo (collection/doc/onSnapshot),
   gravando na tabela public.pipeline_docs. */
function criarDb(){
  var ouvintes={fases:[],cadencias:[],leads:[],b2c_modelos:[]};
  var agendado={};
  async function ler(col){
    var r=await sb.from('pipeline_docs').select('id,data').eq('colecao',col).limit(5000);
    if(r.error)throw dbErro(r.error);
    return r.data.map(function(x){return {id:x.id,data:function(){return x.data}}});
  }
  async function recarregar(col){
    var docs;
    try{docs=await ler(col)}catch(e){ouvintes[col].forEach(function(o){if(o.err)o.err(e)});return}
    ouvintes[col].forEach(function(o){o.cb({docs:docs})});
  }
  function recarregarLogo(col){
    if(agendado[col])return;
    agendado[col]=setTimeout(function(){agendado[col]=0;recarregar(col)},250);
  }
  function ref(col,id){
    return {
      id:id,path:col+'/'+id,
      set:async function(data){
        var r=await sb.from('pipeline_docs').upsert({colecao:col,id:id,data:data},{onConflict:'colecao,id'});
        if(r.error)throw dbErro(r.error);
        recarregarLogo(col);
      },
      update:async function(patch){
        var r=await sb.rpc('pipeline_merge',{p_colecao:col,p_id:id,p_patch:patch});
        if(r.error)throw dbErro(r.error);
        recarregarLogo(col);
      },
      delete:async function(){
        var r=await sb.from('pipeline_docs').delete().eq('colecao',col).eq('id',id);
        if(r.error)throw dbErro(r.error);
        recarregarLogo(col);
      }
    };
  }
  var db={
    collection:function(col){
      return {
        doc:function(){return ref(col,novoId())},
        get:async function(){return {docs:await ler(col)}},
        onSnapshot:function(cb,err){
          var o={cb:cb,err:err};ouvintes[col].push(o);recarregar(col);
          return function(){ouvintes[col]=ouvintes[col].filter(function(x){return x!==o})};
        }
      };
    },
    doc:function(path){var p=path.split('/');return ref(p[0],p[1])}
  };
  /* ao vivo: o banco avisa quando alguém muda algo; a leitura periódica garante mesmo sem aviso */
  try{
    sb.channel('pipeline-docs').on('postgres_changes',{event:'*',schema:'public',table:'pipeline_docs'},function(p){
      var c=(p.new&&p.new.colecao)||(p.old&&p.old.colecao);
      if(c&&ouvintes[c])recarregarLogo(c);else Object.keys(ouvintes).forEach(recarregarLogo);
    }).subscribe();
  }catch(e){}
  setInterval(function(){if(!document.hidden)Object.keys(ouvintes).forEach(recarregarLogo)},20000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)Object.keys(ouvintes).forEach(recarregarLogo)});
  return db;
}

    setTimeout(function(){var i=$('#l-email');if(i)i.focus()},30);
  }else if(qual==='semacesso'){
    caixa.innerHTML=
      '<h2>Sem acesso</h2>'+
      '<p>Este usuário entrou, mas ainda não foi liberado para o Pipeline. Peça à Andrea para liberar o seu e-mail.</p>'+
      '<button class="btn" data-x="sair">Sair</button>';
  }else{
    caixa.innerHTML='<h2>Não foi possível abrir</h2><p>'+esc(msg||'Tente de novo em instantes.')+'</p>'+
      '<button class="btn" data-x="recarregar">Tentar de novo</button> <button class="btn" data-x="sair">Sair</button>';
  }
}
function mostrarApp(){
  document.body.classList.remove('deslogado');
  $('#login').hidden=true;
  $('#who').innerHTML='<span class="who-nome">'+esc(S.me.name)+'</span>'+
    '<button class="btn small" data-x="senha">Minha senha</button>'+
    '<button class="btn small" data-x="sair">Sair</button>';
}
function abrirSenha(){
  var ov=$('#overlay');ov.className='overlay center';ov.hidden=false;
  ov.innerHTML='<form class="sheet modal" id="form-senha" role="dialog" aria-modal="true" aria-label="Trocar senha">'+
    '<div class="sheet-h"><h2>Minha senha</h2><button type="button" class="btn small" data-act="fechar">Cancelar</button></div>'+
    '<label class="field"><span>Nova senha (mínimo 8 caracteres)</span><input id="s-nova" type="password" autocomplete="new-password" minlength="8" required></label>'+
    '<label class="field"><span>Repita a nova senha</span><input id="s-rep" type="password" autocomplete="new-password" minlength="8" required></label>'+
    '<div class="erro-login" id="s-erro" role="alert" hidden></div>'+
    '<button class="btn primary" type="submit">Salvar nova senha</button></form>';
  setTimeout(function(){var i=$('#s-nova');if(i)i.focus()},30);
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-x]');if(!b)return;
  var x=b.dataset.x;
  if(x==='sair'){sb.auth.signOut().then(function(){location.reload()},function(){location.reload()})}
  else if(x==='recarregar'){location.reload()}
  else if(x==='senha'){abrirSenha()}
});
document.addEventListener('submit',async function(e){
  var id=e.target.id;
  if(id==='form-login'){
    e.preventDefault();
    var btn=$('#l-ok'),er=$('#l-erro');er.hidden=true;btn.disabled=true;btn.textContent='Entrando…';
    var r=await sb.auth.signInWithPassword({email:$('#l-email').value.trim(),password:$('#l-senha').value});
    if(r.error){
      er.textContent=(r.error.status===429)?'Muitas tentativas. Espere um minuto e tente de novo.':'E-mail ou senha incorretos.';
      er.hidden=false;btn.disabled=false;btn.textContent='Entrar';return;
    }
    location.reload();
  }
  if(id==='form-senha'){
    e.preventDefault();
    var n=$('#s-nova').value,rp=$('#s-rep').value,er2=$('#s-erro');er2.hidden=true;
    if(n.length<8){er2.textContent='Use pelo menos 8 caracteres.';er2.hidden=false;return}
    if(n!==rp){er2.textContent='As duas senhas precisam ser iguais.';er2.hidden=false;return}
    var u=await sb.auth.updateUser({password:n});
    if(u.error){er2.textContent='Não foi possível trocar a senha. Saia, entre de novo e tente outra vez.';er2.hidden=false;return}
    fechar();toast('Senha alterada');
  }
});

async function iniciar(){
  render();
  if(!window.supabase||!window.supabase.createClient){S.erro='Não foi possível carregar o sistema de login. Recarregue a página.';render();return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'dicas-equipe-auth'}});
  var ses=await sb.auth.getSession();
  var sessao=ses&&ses.data&&ses.data.session;
  if(!sessao){mostrarTela('form');return}
  var eq=await sb.from('pipeline_equipe').select('user_id,nome,papel');
  if(eq.error){mostrarTela('erro','Não consegui verificar o seu acesso. Confira a conexão e tente de novo.');return}
  EQUIPE=eq.data||[];
  var eu=EQUIPE.find(function(x){return x.user_id===sessao.user.id});
  if(!eu){mostrarTela('semacesso');return}
  S.me={id:sessao.user.id,name:eu.nome};
  S.db=criarDb();S.user=criarUsuario();
  mostrarApp();
  assinar('fases','fases');assinar('cadencias','cadencias');assinar('leads','leads');assinar('b2c_modelos','modelos');
  sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')location.reload()});
}
iniciar();

})();

</script>
